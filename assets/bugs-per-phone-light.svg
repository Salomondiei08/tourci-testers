"14" x="192" y="146" fill="#b8b7ae" rx="3"/><rect width="14" height="14" x="208" y="146" fill="#b8b7ae" rx="3"/><text x="232" y="158" fill="#59636e" font-size="13.5"><tspan fill="#1f2328" font-weight="600">6</tspan></text><text x="114" y="185" fill="#59636e" font-size="13.5" text-anchor="end">4 phones</text><rect width="14" height="14" x="128" y="173" fill="#b8b7ae" rx="3"/><text x="152" y="185" fill="#59636e" font-size="13.5">Send buttons overflow at large text</text><text x="114" y="212" fill="#59636e" font-size="13.5" text-anchor="end">5 phones</text><rect width="14" height="14" x="128" y="200" fill="#b8b7ae" rx="3"/><text x="152" y="212" fill="#59636e" font-size="13.5">Icon buttons with no accessibility label</text><text x="114" y="239" fill="#59636e" font-size="13.5" text-anchor="end">6 phones</text><rect width="14" height="14" x="128" y="227" fill="#b8b7ae" rx="3"/><text x="152" y="239" fill="#59636e" font-size="13.5">A failed send only says “Error”</text><text x="114" y="266" fill="#59636e" font-size="13.5" text-anchor="end">10 phones</text><rect width="14" height="14" x="128" y="254" fill="#b8b7ae" rx="3"/><text x="152" y="266" fill="#59636e" font-size="13.5">Settings values cut or broken mid-word</text><text x="114" y="293" fill="#59636e" font-size="13.5" text-anchor="end">12 phones</text><rect width="14" height="14" x="128" y="281" fill="#b8b7ae" rx="3"/><text x="152" y="293" fill="#59636e" font-size="13.5">Device list loads forever, no “nothing found”</text><text x="24" y="322" fill="#6e7781" font-size="12.5">The only blocker was seen by one phone, and no bug by more than 12 of the 20.</text><text x="24" y="340" fill="#6e7781" font-size="12.5">LocalSend, 18 Nov 2026: 10 Android emulators and 10 iOS Simulators, 14 languages.</text></svg>