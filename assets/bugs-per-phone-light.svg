<svg xmlns="http://www.w3.org/2000/svg" width="800" height="370" aria-labelledby="t d" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" role="img" viewBox="0 0 800 370"><title id="t">29 of LocalSend’s 46 bugs were seen by one phone only</title><desc id="d">One square per bug. 29 of the 46 bugs were seen by one phone only, the only blocker included; 6 by two phones; 6 by three; one each by 4, 5, 6, 10 and 12 phones. No bug was seen by more than 12 of the 20.</desc><rect width="799" height="369" x=".5" y=".5" fill="#fff" stroke="#d0d7de" rx="12"/><text x="24" y="38" fill="#1f2328" font-size="17" font-weight="600">29 of LocalSend’s 46 bugs were seen by one phone only</text><text x="24" y="61" fill="#59636e" font-size="13.5">How many of the 20 phones saw each bug: one square per bug, grouped by hand from 103 reports</text><text x="114" y="104" fill="#59636e" font-size="13.5" text-anchor="end">1 phone</text><rect width="14" height="14" x="128" y="92" fill="#2a78d6" rx="3"/><rect width="14" height="14" x="144" y="92" fill="#2a78d6" rx="3"/><rect width="14" height="14" x="160" y="92" fill="#2a78d6" rx="3"/><rect width="14" height="14" x="176" y="92" fill="#2a78d6" rx="3"/><rect width="14" height="14" x="192" y="92" fill="#2a78d6" rx="3"/><rect width="14" height="14" x="208" y="92" fill="#2a78d6" rx="3"/><rect width="14" height="14" x="224" y="92" fill="#2a78d6" rx="3"/><rect width="14" height="14" x="240" y="92" fill="#2a78d6" rx="3"/><rect width="14" height="14" x="256" y="92" fill="#2a78d6" rx="3"/><rect width="14" height="14" x="272" y="92" fill="#2a78d6" rx="3"/><rect width="14" height="14" x="288" y="92" fill="#2a78d6" rx="3"/><rect width="14" height="14" x="304" y="92" fill="#2a78d6" rx="3"/><rect width="14" height="14" x="320" y="92" fill="#2a78d6" rx="3"/><rect width="14" height="14" x="336" y="92" fill="#2a78d6" rx="3"/><rect width="14" height="14" x="352" y="92" fill="#2a78d6" rx="3"/><rect width="14" height="14" x="368" 